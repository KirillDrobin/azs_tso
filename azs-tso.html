<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#004D7B">
<title>АЗС</title>
<style>
  :root {
    --brand: #004D7B;
    --brand-dark: #00334F;
    --bg: #F5F9FC;
    --ink: #0F1E2B;
    --muted: #5F7385;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #E3EBF1;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; justify-content: center;
    overscroll-behavior: none;
  }
  #app {
    position: relative; width: 100%; max-width: 560px; height: 100dvh;
    background: var(--bg); overflow: hidden;
  }
  .screen {
    position: absolute; inset: 0; display: none; flex-direction: column;
    padding: max(16px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
    overflow-y: auto;
  }
  .screen.active { display: flex; }
  .screen.fade { animation: fade .22s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }

  h1 { font-size: clamp(30px, 8.5vw, 46px); line-height: 1.1; text-align: center; margin: 14px 0 0; font-weight: 800; }
  .spacer { flex: 1; }

  /* кнопки */
  button { font: inherit; border: 0; cursor: pointer; color: #fff; touch-action: manipulation; }
  .primary {
    width: 100%; min-height: 76px; border-radius: 26px; background: var(--brand);
    font-size: clamp(26px, 7vw, 34px); font-weight: 800; box-shadow: 0 6px 0 var(--brand-dark);
    transition: transform .08s, box-shadow .08s;
  }
  .primary:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 var(--brand-dark); }
  .primary:disabled { background: #C5D0D9; box-shadow: 0 6px 0 #A9B7C3; color: #EEF3F7; cursor: default; }
  .back {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 6px;
    background: rgba(0,77,123,.12); color: var(--brand); font-weight: 700;
    font-size: 20px; padding: 10px 20px 10px 12px; border-radius: 999px; min-height: 48px;
  }
  .back svg { width: 22px; height: 22px; }

  /* плитки */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: auto 0; }
  .tile {
    aspect-ratio: 1 / 1; border-radius: 30px; background: var(--brand);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    font-size: clamp(18px, 5.6vw, 30px); font-weight: 800; text-align: center; padding: 10px; overflow-wrap: anywhere; min-width: 0;
    box-shadow: 0 7px 0 var(--brand-dark); transition: transform .08s, box-shadow .08s;
  }
  .tile:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--brand-dark); }
  .tile svg { width: 42%; height: 42%; fill: none; stroke: #fff; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tile .emoji { font-size: clamp(54px, 17vw, 88px); line-height: 1; }
  .grid.single-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  /* маскот + облачко */
  .mascot-wrap { position: relative; display: flex; justify-content: center; margin: auto 0; padding-top: 110px; }
  .mascot-wrap img { width: min(74vw, 330px, 44dvh); height: auto; display: block; }
  .bubble {
    position: absolute; top: 0; left: 50%; margin-left: -40px; width: min(54vw, 240px);
    background: #fff; border: 3px solid var(--brand); border-radius: 22px; padding: 12px 16px;
    font-size: clamp(18px, 4.8vw, 22px); font-weight: 800; text-align: center; line-height: 1.2;
    box-shadow: 0 5px 14px rgba(0,0,0,.12);
  }
  .bubble::after {
    content: ""; position: absolute; left: 26px; bottom: -22px; width: 26px; height: 24px;
    background: #fff; clip-path: polygon(0 0, 100% 0, 18% 100%);
    filter: drop-shadow(0 3px 0 var(--brand));
  }
  .bubble::before {
    content: ""; position: absolute; left: 22px; bottom: -27px; width: 34px; height: 30px;
    background: var(--brand); clip-path: polygon(0 0, 100% 0, 14% 100%);
  }
  .bubble span { position: relative; z-index: 1; }

  /* ввод */
  .field { position: relative; margin-top: 18px; }
  .field input {
    width: 100%; height: 76px; border-radius: 22px; border: 3px solid #D6E1EA; background: #fff;
    font-size: 32px; padding: 0 64px 0 20px; color: var(--ink); outline: none; font-weight: 700;
  }
  .field input:focus { border-color: var(--brand); }
  .field input::placeholder { color: #9FB0BF; font-weight: 600; }
  .field .unit { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 30px; color: var(--muted); font-weight: 700; }

  /* прогресс */
  .bar { height: 30px; background: #D9E4EC; border-radius: 999px; overflow: hidden; margin: 22px 0 0; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2C86B8, var(--brand)); border-radius: 999px; transition: width .08s linear; }
  .status { text-align: center; font-size: clamp(22px, 6vw, 30px); font-weight: 700; color: var(--muted); }
  .center { margin: auto 0; display: flex; flex-direction: column; justify-content: center; }
  .done { text-align: center; }
  .done h2 { font-size: clamp(34px, 9.5vw, 50px); margin: 0 0 6px; line-height: 1.1; }
  .done img { width: min(70vw, 320px, 40dvh); animation: hop 1.1s ease-in-out infinite; }
  @keyframes hop { 50% { transform: translateY(-14px) rotate(-2deg); } }
  [hidden] { display: none !important; }
  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: #0F1E2B; color: #fff;
    padding: 14px 24px; border-radius: 16px; font-size: 18px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 9;
  }
  .toast.show { opacity: .95; }
</style>
</head>

    <button class="primary" id="doneBtn" hidden>Готово</button>

</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  const screens = {};
  document.querySelectorAll('.screen').forEach(s => screens[s.id] = s);
  const navStack = ['welcome'];
  let flow = { type: 'fuel', pump: 1, good: '' };
  let timer = null;

  function show(id, animate) {
    Object.values(screens).forEach(s => s.classList.remove('active', 'fade'));
    const s = screens[id];
    s.classList.add('active');
    if (animate !== false) s.classList.add('fade');
    s.scrollTop = 0;
    if (id === 'progress') startProgress();
  }
  function go(id, animate) { navStack.push(id); show(id, animate); }
  function back() {
    if (navStack.length > 1) navStack.pop();
    show(navStack[navStack.length - 1]);
  }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-back')) return back();
    if (b.dataset.go) {
      if (b.dataset.go === 'progress') { /* flow уже выбран */ }
      return go(b.dataset.go, b.dataset.anim === 'no' ? false : true);
    }
    if (b.dataset.pump) {
      flow = { type: 'fuel', pump: +b.dataset.pump };
      document.getElementById('pumpTitle').textContent = 'Колонка ' + flow.pump;
      sum.value = ''; liters.value = ''; update();
      return go('amount');
    }
    if (b.dataset.good) { flow = { type: 'goods', good: b.dataset.good }; return go('payment'); }
  });

  document.getElementById('promo').addEventListener('click', () => toast('Раздел «Акции» скоро появится'));

  // ввод
  const sum = document.getElementById('sum');
  const liters = document.getElementById('liters');
  const payBtn = document.getElementById('payBtn');
  function digits(el) { el.value = el.value.replace(/\D+/g, '').slice(0, 6); update(); }
  function update() { payBtn.disabled = !((+sum.value > 0) || (+liters.value > 0)); }
  sum.addEventListener('input', () => digits(sum));
  liters.addEventListener('input', () => digits(liters));
  payBtn.addEventListener('click', () => { document.activeElement.blur(); go('payment'); });

  // прогресс
  function startProgress() {
    const fuel = flow.type === 'fuel';
    const title = fuel ? 'Идёт заправка…' : 'Идёт оплата…';
    const fill = document.getElementById('barFill');
    const status = document.getElementById('status');
    document.getElementById('running').hidden = false;
    document.getElementById('result').hidden = true;
    document.getElementById('doneBtn').hidden = true;
    document.getElementById('resultText').textContent = fuel ? 'Заправка завершена!' : 'Оплата прошла успешно!';
    let v = 0; fill.style.width = '0%'; status.textContent = title;
    clearInterval(timer);
    timer = setInterval(() => {
      if (Math.floor(Math.random() * 6) === 0) return;       // «подвисаем» для реалистичности
      v = Math.min(1, v + 0.004 + Math.random() * 0.016);
      fill.style.width = (v * 100) + '%';
      status.textContent = title + ' ' + Math.floor(v * 100) + '%';
      if (v >= 1) {
        clearInterval(timer);
        setTimeout(() => {
          document.getElementById('running').hidden = true;
          document.getElementById('result').hidden = false;
          document.getElementById('doneBtn').hidden = false;
        }, 350);
      }
    }, 50);
  }
  document.getElementById('doneBtn').addEventListener('click', () => {
    navStack.length = 0; navStack.push('welcome'); show('welcome');
  });
  // аппаратная кнопка «назад» на Android
  window.history.pushState({}, '');
  window.addEventListener('popstate', () => { window.history.pushState({}, ''); back(); });
})();
</script>
